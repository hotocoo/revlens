name: lens-selftest
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  lens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: lens
        uses: ./
        with:
          fail-on: missing-work
      - run: test -s "${{ steps.lens.outputs.record }}"
