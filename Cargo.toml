[package]
name = "revlens"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Intent-aware, risk-ranked, live multi-reviewer code review for git changes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hotocoo/revlens"
homepage = "https://github.com/hotocoo/revlens"
readme = "README.md"
keywords = ["code-review", "git", "diff", "tree-sitter", "collaboration"]
categories = ["development-tools", "command-line-utilities"]
include = ["/src/**", "!/src/snapshots/**", "/ui/dist/**", "/README.md", "/LICENSE-*", "/examples/**"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "signal"] }
toml = "1.1.8"
tree-sitter = "0.26"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
yrs = { version = "0.28.0", features = ["sync"] }

[dev-dependencies]
futures-util = "0.3.34"
insta = { version = "1.49.0", features = ["json"] }
proptest = "1.12.0"
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"

[profile.test]
opt-level = 1

[profile.release]
lto = "thin"
strip = true
